<svg width="1280" height="920" viewBox="0 0 1280 920" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Simplified Taskquatch Architecture</title>
  <desc id="desc">Clients and web properties connect through API Gateway and WebSocket APIs to AWS Lambda. Lambda coordinates data stores, queues, object storage, realtime state, and external providers. Terraform provisions the AWS environment.</desc>
